---
layout: default
---
<section class="page-head">
  <div class="container narrow">
    <p class="eyebrow"><a href="{{ '/research/' | relative_url }}">Research</a></p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
  </div>
</section>
<section class="section">
  <div class="container narrow prose">
    {% if page.image %}
    <figure class="post-figure">
      <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}" loading="lazy">
    </figure>
    {% endif %}
    {{ content }}
    {% if page.openings %}
    <aside class="callout">
      <h2>Openings</h2>
      {{ page.openings | markdownify }}
      <p><a class="btn btn-primary" href="{{ '/join/' | relative_url }}">How to apply</a></p>
    </aside>
    {% endif %}
  </div>
</section>
